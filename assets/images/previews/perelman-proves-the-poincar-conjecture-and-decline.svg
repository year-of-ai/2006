<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 1024" role="img" width="1536" height="1024">
  <title>Perelman proves the Poincaré conjecture and declines the Fields Medal – retro pixel art banner</title>
  <defs>
    <radialGradient id="crtGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0a0a2e" />
      <stop offset="100%" stop-color="#000008" />
    </radialGradient>
    <radialGradient id="sphereGrad" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#00ffcc" />
      <stop offset="40%" stop-color="#0088ff" />
      <stop offset="100%" stop-color="#001133" />
    </radialGradient>
    <radialGradient id="medalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffdd00" />
      <stop offset="100%" stop-color="#aa6600" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="crtFilter">
      <feGaussianBlur stdDeviation="0.8" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="scanlines" x="0" y="0" width="1" height="4" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1536" height="2" fill="black" opacity="0.25" />
    </pattern>
    <pattern id="pixelGrid" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="8" height="8" fill="none" stroke="#001a44" stroke-width="0.3" />
    </pattern>
  </defs>

  
  <rect width="1536" height="1024" fill="url(#crtGlow)" />
  <rect width="1536" height="1024" fill="url(#pixelGrid)" opacity="0.4" />

  
  <rect x="0" y="0" width="1536" height="16" fill="#001166" />
