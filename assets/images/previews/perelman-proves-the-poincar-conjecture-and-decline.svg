  </g>

  
  <text x="820" y="860" font-family="monospace" font-size="32" fill="#0044cc" opacity="0.5">π₁(M³)=0</text>
  <text x="820" y="910" font-family="monospace" font-size="28" fill="#003399" opacity="0.4">⟹ M³≅S³</text>

  
  
  <rect x="40" y="36" width="1456" height="260" fill="#000822" stroke="#0044ff" stroke-width="4" />
  
