    </g>

    
    <circle cx="420" cy="400" r="70" fill="white" opacity="0.12" />
    <circle cx="400" cy="380" r="30" fill="white" opacity="0.18" />

    
    <g stroke="#ff4488" stroke-width="6" fill="none" opacity="0.9" filter="url(#glow)">
      <path d="M 500 300 Q 620 380 640 512 Q 620 640 500 720 Q 380 640 360 512 Q 380 380 500 300 Z" />
      
      <path d="M 500 300 L 500 512" stroke="#ff4488" stroke-width="4" stroke-dasharray="12,8" />
      <polygon points="500,480 488,510 512,510" fill="#ff4488" stroke="none" />
    </g>
    
    <text x="660" y="308" font-family="monospace" font-size="22" fill="#ff4488" filter="url(#glow)" font-weight="bold">LOOP→POINT</text>
  </g>

  
  <text x="500" y="830" text-anchor="middle" font-family="monospace" font-size="20" fill="#00ffcc" filter="url(#glow)" letter-spacing="3">S³ ≅ SIMPLY CONNECTED</text>

  
  
