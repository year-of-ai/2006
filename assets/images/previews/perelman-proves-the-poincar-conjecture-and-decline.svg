    <rect x="-72" y="-80" width="24" height="24" fill="#ff0000" opacity="0.8" />
    <rect x="48" y="-80" width="24" height="24" fill="#ff0000" opacity="0.8" />
    <rect x="-72" y="56" width="24" height="24" fill="#ff0000" opacity="0.8" />
    <rect x="48" y="56" width="24" height="24" fill="#ff0000" opacity="0.8" />
  </g>

  
  <text x="1300" y="608" text-anchor="middle" font-family="monospace" font-size="28" fill="#ff2222" font-weight="bold" filter="url(#glow)" letter-spacing="4">DECLINED</text>

  
  <g stroke="#ff4400" stroke-width="4" fill="none" opacity="0.8">
    <path d="M 1200 560 Q 1240 540 1228 500" stroke-dasharray="16,8" />
    <polygon points="1228,500 1218,528 1240,524" fill="#ff4400" stroke="none" />
  </g>

  
  
  <g transform="translate(850, 200)" opacity="0.8">
    <text x="0" y="0" font-family="monospace" font-size="18" fill="#00aaff" filter="url(#glow)">RICCI FLOW</text>
    
    <rect x="0" y="10" width="40" height="48" rx="20" fill="none" stroke="#0088ff" stroke-width="3" />
    <text x="48" y="42" font-family="monospace" font-size="20" fill="#0066cc">→</text>
    <ellipse cx="88" cy="34" rx="28" ry="22" fill="none" stroke="#0099ff" stroke-width="3" />
    <text x="124" y="42" font-family="monospace" font-size="20" fill="#0066cc">→</text>
    <circle cx="164" cy="34" r="22" fill="none" stroke="#00ccff" stroke-width="3" />
  </g>

  
  <g transform="translate(820, 250)">
    <rect x="0" y="0" width="180" height="40" fill="#112200" stroke="#44ff00" stroke-width="3" />
