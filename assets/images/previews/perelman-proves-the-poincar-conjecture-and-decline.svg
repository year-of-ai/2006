  <text x="768" y="130" text-anchor="middle" font-family="monospace" font-size="72" font-weight="bold" fill="#00ffcc" filter="url(#glow)" letter-spacing="2">PERELMAN PROVES</text>
  <text x="768" y="210" text-anchor="middle" font-family="monospace" font-size="58" font-weight="bold" fill="#ffffff" filter="url(#glow)" letter-spacing="1">THE POINCARÉ CONJECTURE</text>
  <text x="768" y="272" text-anchor="middle" font-family="monospace" font-size="40" font-weight="bold" fill="#ff4444" filter="url(#glow)" letter-spacing="3">AND DECLINES THE FIELDS MEDAL</text>

  
  <rect x="40" y="300" width="320" height="48" fill="#001133" stroke="#0044ff" stroke-width="2" />
  <text x="56" y="333" font-family="monospace" font-size="26" fill="#ffcc00" font-weight="bold" filter="url(#glow)">ICM MADRID 2006</text>

  
  <rect x="16" y="940" width="1504" height="68" fill="#000822" stroke="#0033aa" stroke-width="2" />
  
  <text x="40" y="984" font-family="monospace" font-size="22" fill="#00ffcc">STAGE: TOPOLOGY</text>
  <text x="400" y="984" font-family="monospace" font-size="22" fill="#ffcc00">CONJECTURE: SOLVED</text>
  <text x="780" y="984" font-family="monospace" font-size="22" fill="#ff4444">MEDAL: REFUSED</text>
  <text x="1100" y="984" font-family="monospace" font-size="22" fill="#aaaaff">POINCARÉ 1904–2006</text>
  
