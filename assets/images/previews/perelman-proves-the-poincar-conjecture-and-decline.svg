    <circle cx="500" cy="512" r="288" fill="#001133" />
    
    <circle cx="500" cy="512" r="272" fill="url(#sphereGrad)" />

    
    
    <g opacity="0.35" stroke="#00ffcc" stroke-width="2" fill="none">
      
      
      <line x1="228" y1="512" x2="772" y2="512" stroke="#00ffcc" stroke-width="3" />
      
      <ellipse cx="500" cy="512" rx="272" ry="90" stroke="#00ffcc" stroke-width="2" />
      <ellipse cx="500" cy="512" rx="272" ry="180" stroke="#00ffcc" stroke-width="2" />
      <ellipse cx="500" cy="368" rx="200" ry="66" stroke="#00aaff" stroke-width="1.5" />
